<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Dicee</title>
    <link rel="stylesheet" href="styles.css" />
    
    <link
      href="https://fonts.googleapis.com/css?family=Indie+Flower|Lobster"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>Feeling Lucky?</h1>
      <div><button id="rollButton">Roll Dice</button></div>
      <div class="dice">
        <input type="text" id="player1Input" placeholder="Player 1">
        <img class="img1" src="./images/dice6.png" />
      </div>

      <div class="dice">
        <input type="text" id="player2Input" placeholder="Player 2">
        <img class="img2" src="./images/dice6.png" />
      </div>
      <h2 class="result">Good Luck</h2>
    </div>
  
    <footer>🎲 Gambling Not Suggested 🎲</footer>
    <script src="index.js"></script>
  </body>
</html>
